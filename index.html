<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Calculator App</h1>

  <div class="calculator">

    <div class="top">
      <input type="text" id="display">
      <button class="clear">C</button>
    </div>

    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">/</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">*</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">-</button>

      <button>0</button>
      <button>.</button>
      <button class="equals">=</button>
      <button class="operator">+</button>
    </div>

  </div>

</body>
</html>
